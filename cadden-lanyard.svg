<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 760" width="420" height="760" role="img" aria-label="Cadden Chua credential card on a lanyard">
<title>Cadden Chua &#8212; lanyard credential card</title>
<defs>
<style type="text/css"><![CDATA[
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.disp{font-family:'Trebuchet MS','Gill Sans',Avenir,'Segoe UI',sans-serif}
@keyframes settle{0%{transform:rotate(0deg) translateY(-780px)}18%{transform:rotate(0deg) translateY(0)}30%{transform:rotate(12deg)}46%{transform:rotate(-8.5deg)}62%{transform:rotate(5.5deg)}78%{transform:rotate(-3deg)}92%{transform:rotate(1.4deg)}100%{transform:rotate(0deg)}}
@keyframes sway{0%,100%{transform:rotate(-2.8deg)}50%{transform:rotate(2.8deg)}}
@keyframes wobble{0%,100%{transform:rotate(1.4deg)}50%{transform:rotate(-1.4deg)}}
/* end must clear card width + skew offset (tan20deg * 708 = 258px), else the sweep parks mid-card */
@keyframes holoSweep{0%{transform:translateX(-300px) skewX(-20deg)}55%,100%{transform:translateX(680px) skewX(-20deg)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0}to{opacity:1}}
.settle{transform-origin:210px 6px;animation:settle 3.4s cubic-bezier(.34,1.1,.5,1) forwards}
.sway{transform-origin:210px 6px;animation:sway 4.6s ease-in-out 3.4s infinite}
.wob{transform-origin:210px 300px;animation:wobble 4.6s ease-in-out 3.4s infinite}
.holo{animation:holoSweep 5.5s ease-in-out 3.8s infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:spin 22s linear infinite}
.fu{opacity:0;animation:fadeUp .5s ease-out forwards}
]]></style>

<linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#0b5f74"/><stop offset="45%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0b5f74"/>
</linearGradient>
<linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%"><animate attributeName="stop-color" values="#22d3ee;#a78bfa;#f0abfc;#4ade80;#22d3ee" dur="9s" repeatCount="indefinite"/></stop>
  <stop offset="50%"><animate attributeName="stop-color" values="#f0abfc;#4ade80;#22d3ee;#a78bfa;#f0abfc" dur="9s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#4ade80;#22d3ee;#a78bfa;#f0abfc;#4ade80" dur="9s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
  <stop offset="35%" stop-color="#a78bfa" stop-opacity=".14"/>
  <stop offset="50%" stop-color="#fff" stop-opacity=".26"/>
  <stop offset="65%" stop-color="#22d3ee" stop-opacity=".14"/>
  <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#c9d1d9"/><stop offset="42%" stop-color="#8b949e"/><stop offset="58%" stop-color="#5a636d"/><stop offset="100%" stop-color="#9aa3ad"/>
</linearGradient>
<radialGradient id="halo"><stop offset="0%" stop-color="#a78bfa" stop-opacity=".16"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<radialGradient id="panelglow"><stop offset="0%" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>

<pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
  <path d="M16 0H0V16" fill="none" stroke="#22d3ee" stroke-opacity=".10" stroke-width="1"/>
</pattern>

<filter id="glow"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="drop" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity=".55"/></filter>
<clipPath id="cardclip"><rect x="82" y="298" width="256" height="410" rx="18"/></clipPath>
<clipPath id="panelclip"><rect x="103" y="335" width="214" height="214" rx="11"/></clipPath>
</defs>

<circle cx="210" cy="500" r="230" fill="url(#halo)"><animate attributeName="r" values="230;250;230" dur="6s" repeatCount="indefinite"/></circle>

<g class="settle">
<g class="sway">

  <!-- lanyard straps -->
  <path d="M150 0 L178 0 L219 254 L199 260 Z" fill="url(#strap)"/>
  <path d="M242 0 L270 0 L221 260 L201 254 Z" fill="url(#strap)"/>
  <path d="M164 0 L208 256" stroke="#0d1117" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="5 5" fill="none"/>
  <path d="M256 0 L212 256" stroke="#0d1117" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="5 5" fill="none"/>
  <g class="mono" fill="#0d1117" fill-opacity=".55" font-size="9" letter-spacing="1.6" text-anchor="middle">
    <text x="164" y="52" transform="rotate(9 164 52)">CADZCHUA</text>
    <text x="180" y="140" transform="rotate(9 180 140)">CADZCHUA</text>
    <text x="196" y="228" transform="rotate(9 196 228)">CADZCHUA</text>
    <text x="256" y="52" transform="rotate(-9 256 52)">CADZCHUA</text>
    <text x="240" y="140" transform="rotate(-9 240 140)">CADZCHUA</text>
    <text x="224" y="228" transform="rotate(-9 224 228)">CADZCHUA</text>
  </g>

  <!-- clasp -->
  <circle cx="210" cy="266" r="15" fill="none" stroke="url(#metal)" stroke-width="5"/>
  <rect x="197" y="272" width="26" height="34" rx="7" fill="url(#metal)"/>
  <rect x="203" y="280" width="14" height="6" rx="3" fill="#0d1117" fill-opacity=".55"/>
  <rect x="200" y="292" width="20" height="2" fill="#fff" fill-opacity=".25"/>

  <!-- credential card -->
  <g class="wob" filter="url(#drop)">
    <rect x="82" y="298" width="256" height="410" rx="18" fill="url(#foil)"/>
    <rect x="90" y="306" width="240" height="394" rx="12" fill="#f7f3ec"/>

    <!-- lanyard slot punched through the paper -->
    <rect x="191" y="318" width="38" height="9" rx="4.5" fill="#d9d2c6" stroke="#bdb5a6" stroke-width="1"/>

    <!-- monogram panel (no photo: the banner owns the portrait) -->
    <rect x="103" y="335" width="214" height="214" rx="11" fill="#0b1a24"/>
    <g clip-path="url(#panelclip)">
      <rect x="103" y="335" width="214" height="214" fill="url(#grid)"/>
      <circle cx="210" cy="442" r="96" fill="url(#panelglow)">
        <animate attributeName="r" values="90;104;90" dur="5.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle class="ring" cx="210" cy="442" r="82" fill="none" stroke="url(#foil)" stroke-width="1.4" stroke-dasharray="9 13" opacity=".55"/>
    <circle cx="210" cy="442" r="67" fill="none" stroke="url(#foil)" stroke-width="1.8" opacity=".8"/>
    <text class="disp" x="210" y="466" text-anchor="middle" font-size="60" font-weight="bold" letter-spacing="2" fill="url(#foil)" filter="url(#glow)">CC</text>
    <rect x="103" y="335" width="214" height="214" rx="11" fill="none" stroke="#000" stroke-opacity=".12" stroke-width="1"/>

    <!-- caption plate -->
    <text class="disp fu" style="animation-delay:3.5s" x="210" y="592" text-anchor="middle" font-size="25" font-weight="bold" letter-spacing="1.4" fill="#10212b">Cadden Chua</text>
    <text class="mono fu" style="animation-delay:3.65s" x="210" y="612" text-anchor="middle" font-size="8.5" letter-spacing="2.6" fill="#6b7f8a">SOFTWARE &#183; AI / ML</text>

    <line x1="112" y1="628" x2="308" y2="628" stroke="#d8d0c2" stroke-width="1" stroke-dasharray="3 4"/>

    <g class="mono fu" style="animation-delay:3.85s" font-size="8.5" letter-spacing=".9">
      <text x="112" y="650" fill="#94a3ad">LOCATION</text>
      <text x="308" y="650" text-anchor="end" fill="#33424c">SINGAPORE</text>
      <text x="112" y="668" fill="#94a3ad">STATUS</text>
      <text x="308" y="668" text-anchor="end" fill="#33424c">STUDENT</text>
    </g>

    <text class="mono fu" style="animation-delay:4s" x="210" y="688" text-anchor="middle" font-size="7.5" letter-spacing="3" fill="#a8b4bc">@CADZCHUA</text>

    <!-- holographic sheen over the whole card -->
    <g clip-path="url(#cardclip)">
      <rect class="holo" x="-60" y="298" width="120" height="410" fill="url(#sheen)"/>
    </g>

    <!-- print cut marks -->
    <g stroke="#b9b1a3" stroke-width="1" opacity=".7">
      <path d="M96 306 v-4 M90 312 h-4"/><path d="M324 306 v-4 M330 312 h4"/>
      <path d="M96 700 v4 M90 694 h-4"/><path d="M324 700 v4 M330 694 h4"/>
    </g>
  </g>
</g>
</g>
</svg>
