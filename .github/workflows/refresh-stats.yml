name: Refresh Stat Cards

on:
  schedule:
    # 06:17 UTC daily. Off the hour on purpose: GitHub queues scheduled jobs
    # heavily at :00 and they can be delayed or dropped.
    - cron: "17 6 * * *"
  workflow_dispatch:

# never let two runs rewrite the same cards at once
concurrency:
  group: refresh-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the cards
        env:
          # the default token is enough for the REST and search endpoints used here
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_USER: ${{ github.repository_owner }}
        run: python .github/stats/update_stats.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- cadden-stats.svg cadden-langs.svg; then
            echo "figures unchanged; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cadden-stats.svg cadden-langs.svg
          git commit -m "chore: refresh stat cards"
          git push
