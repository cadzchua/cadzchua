name: Generate Contribution Snake

on:
  schedule:
    - cron: "43 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml

# Finish publishing before another run starts writing the output branch.
concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      SNAKE_OUTPUTS: |
        dist/github-snake.svg?palette=github-light&color_snake=#0891b2
        dist/github-snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#0e4a52,#177f8c,#22d3ee,#4ade80
    steps:
      - name: Generate with optional profile token
        id: profile
        if: env.PROFILE_TOKEN != ''
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ env.PROFILE_TOKEN }}
          outputs: ${{ env.SNAKE_OUTPUTS }}

      - name: Report profile token fallback
        if: steps.profile.outcome == 'failure'
        run: echo "::warning::PROFILE_TOKEN generation failed; retrying with the automatic workflow token. Check or remove PROFILE_TOKEN in repository secrets."

      - name: Generate with automatic workflow token
        if: env.PROFILE_TOKEN == '' || steps.profile.outcome == 'failure'
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ github.token }}
          outputs: ${{ env.SNAKE_OUTPUTS }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
